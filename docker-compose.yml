services:
  # Local STT + spoken-language detection. Deliberately its own service:
  # ci-watch only recreates the web/worker pair, so this service keeps its
  # warm whisper model across deploys, and its CPU cannot be starved by the
  # app's ffmpeg transcodes (nor the other way round). The app reaches it by
  # name on the shared network; it is not published to the host, because the
  # host firewall drops bridge->host traffic anyway.
  stt:
    image: sau-stt:local
    build:
      context: .
      dockerfile: docker/stt/Dockerfile
      args:
        STT_MODEL: ${SAU_STT_LOCAL_MODEL:-tiny}
        SAU_UID: ${SAU_UID:-1000}
        SAU_GID: ${SAU_GID:-1000}
    container_name: sau-stt
    restart: always
    env_file:
      - .env
    environment:
      - SAU_STT_LOCAL_THREADS=${SAU_STT_LOCAL_THREADS:-3}
      - SAU_STT_LOCAL_PORT=9099
      - SAU_STT_LOCAL_CACHE=/cache
    volumes:
      - sau-stt-cache:/cache
    # Published on loopback so host-run tooling (the language backfill, the test
    # suite) can reach it too; the app container uses the service name.
    ports:
      - "127.0.0.1:9099:9099"
    networks:
      - 1panel-network

  social-auto-upload: &sau-service
    # ci-watch is the sole production deployer. Both roles use one tested,
    # immutable image; registry/Watchtower updates cannot bypass release gates.
    image: ${SAU_IMAGE:-ghcr.io/willywang8216/social-auto-upload:latest}
    pull_policy: never
    container_name: social-auto-upload
    # Run as the host operator's uid/gid (default 1000). The image sets no USER,
    # so Docker defaulted to root and every bind-mounted dir the app writes
    # (generated/, videoFile/, data/) came out root-owned. The host user (will,
    # uid 1000) — including the host-run test suite and the scripts/ and agent
    # tooling — then could not write into generated/campaigns/<id>, failing
    # media prep with PermissionError and killing loguru's sink (ValueError:
    # I/O operation on closed file). Matching the host uid makes both sides
    # write the same files. Override for a host whose operator is not 1000.
    user: "${SAU_UID:-1000}:${SAU_GID:-1000}"
    restart: always
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 65m
    # Preserve the long request ceiling; graceful shutdown must also let an
    # already accepted request finish. Queue work is owned by worker below.
    command:
      - gunicorn
      - wsgi:app
      - --workers
      - "1"
      - --threads
      - "8"
      - --timeout
      - "1800"
      - --graceful-timeout
      - "1800"
      - --bind
      - 0.0.0.0:5409
    # Docker's default json-file driver never rotates, and `docker logs` already
    # hangs on this box trying to read the result. Cap it so container output
    # can't quietly eat the disk; anything worth reading goes to ./logs, which
    # logrotate manages.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ci-watch runs every two minutes and shares a lock with deploy-local.sh.
    # Keep Watchtower disabled for BOTH roles to prevent mismatched releases.
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    healthcheck:
      # Readiness includes schema + a fresh non-draining publisher heartbeat.
      # A deployment pause deliberately reports unhealthy until activation.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5409/readyz', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "5409:5409"
    volumes:
      - ./videoFile:/app/videoFile
      - ./uploads:/app/uploads
      - ./generated:/app/generated
      - ./cookiesFile:/app/cookiesFile
      - ./cookies:/app/cookies
      - ${SAU_CONF_FILE:-./conf.py}:/app/conf.py
      - ./data:/app/data
      - ./db:/app/db
      # SAU-Inbox (phone-first) state: the watcher lives at /home/will/sau-inbox
      # (host absolute, sibling of this app dir). RW so the app can approve/
      # reject items (atomic tmp+rename in inbox_ops); the watcher owns the
      # media files, the app only ever touches state.json.
      - /home/will/sau-inbox:/app/sau-inbox
      # Offload + digest logs so MCP/UI system-health can show the last run.
      - ./logs:/app/logs
      # rclone config for reading the offload cache back. It holds ONLY the
      # GDrive remote: the worker never needs anything else, and keeping it
      # separate from the operator's rclone.conf means a container compromise
      # cannot reach the other remotes. Writable so rclone can persist a
      # refreshed OAuth token.
      - ./rclone-cache.conf:/app/rclone-cache.conf
    networks:
      - 1panel-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment: &sau-environment
      # Non-secret overrides only. All secrets still come from .env.
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      SAU_PROCESS_ROLE: web
      SAU_REQUIRE_WORKER_HEALTH: "1"
      SAU_DB_PATH: /app/db/database.db
      SAU_PAUSE_CLAIMS_FILE: /app/db/publish.pause
      SAU_ACCOUNT_MAINTENANCE_INTERVAL_SECONDS: "600"
      SAU_ACCOUNT_MAINTENANCE_EXPIRING_WITHIN_SECONDS: "3600"
      BROWSERLESS_URL: http://browserless:3000
      # Only the GDrive cache config is mounted, not the operator's remotes.
      RCLONE_CONFIG: /app/rclone-cache.conf
      SAU_STORAGE_BACKENDS: share,do_spaces
      # share remains disabled until its existing Telegram token is refreshed.
      SAU_SHARE_ENABLED: "0"
      SAU_SHARE_PUBLIC_BASE: https://share.iamwillywang.com
      SAU_SHARE_UPLOAD_BASE: http://share-web
      # DIRECT_POST verified domains; FILE_UPLOAD does not require these.
      SAU_TIKTOK_VERIFIED_URL_PREFIXES: https://pub-9915b1494003455c9ab872fd7094e64e.r2.dev/,https://share.iamwillywang.com/

  worker:
    # Inherit the EXACT image, uid, data/config mounts, network, logging and
    # environment. Only this process starts publishing and maintenance loops.
    <<: *sau-service
    container_name: social-auto-upload-worker
    command: ["python", "-m", "myUtils.worker", "--max-concurrent", "3"]
    ports: []
    environment:
      <<: *sau-environment
      SAU_PROCESS_ROLE: worker
      SAU_REQUIRE_WORKER_HEALTH: "0"
    healthcheck:
      test: ["CMD", "python", "scripts/release_probe.py", "worker"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Local development PostgreSQL for the multi-tenant migration (Phase 2+).
  # Opt-in: it only starts with `docker compose --profile dev up`, so the
  # production web/worker stack is unchanged. Point the app/tests at it via
  #   DATABASE_URL=postgresql+psycopg://sau:sau@postgres:5432/sau
  #   TEST_DATABASE_URL=postgresql+psycopg://sau:sau@localhost:5433/sau
  postgres:
    image: postgres:16-alpine
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: sau
      POSTGRES_PASSWORD: sau
      POSTGRES_DB: sau
    ports:
      - "5433:5432"
    volumes:
      - sau_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sau"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sau_pgdata:
  sau-stt-cache:

networks:
  1panel-network:
    external: true
