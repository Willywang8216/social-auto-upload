services:
  social-auto-upload:
    # Pull the published image rather than building it locally so Watchtower
    # can actually update it (the previous `build: .` produced
    # `social-auto-upload-social-auto-upload:latest`, which lives on Docker
    # Hub under nobody — Watchtower would 401 every cycle). The GHCR image
    # is published by `.github/workflows/image.yml` on every push to main.
    image: ghcr.io/willywang8216/social-auto-upload:latest
    pull_policy: always
    container_name: social-auto-upload
    restart: always
    # Watchtower:
    #  * `com.centurylinklabs.watchtower.enable=true` opts the container in
    #    to Watchtower polling (the host already runs `Watchtower` with
    #    `--interval 3600 --cleanup` and no WATCHTOWER_LABEL_ENABLE flag, so
    #    by default it watches everything — but opt-in is the convention
    #    used by sibling stacks and keeps the intent explicit).
    #  * `com.centurylinklabs.watchtower.monitor-only=false` lets Watchtower
    #    both restart the container on crash AND pull a fresh image every
    #    hour. Set to `true` if you'd rather Watchtower only alert.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.monitor-only: "false"
    healthcheck:
      # Cheap probe: a 200 from the static SPA proves the container is
      # serving traffic and can reach its bound port. Watchtower's own
      # monitor-only health check relies on this HEALTHCHECK firing.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5409/', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "5409:5409"
    volumes:
      - ./videoFile:/app/videoFile
      - ./uploads:/app/uploads
      - ./cookiesFile:/app/cookiesFile
      - ./cookies:/app/cookies
      - ${SAU_CONF_FILE:-./conf.py}:/app/conf.py
      - ./data:/app/data
      - ./db:/app/db
    networks:
      - 1panel-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Non-secret overrides only. All secrets come from .env
      - SAU_ACCOUNT_MAINTENANCE_INTERVAL_SECONDS=600
      - SAU_ACCOUNT_MAINTENANCE_EXPIRING_WITHIN_SECONDS=3600
      - BROWSERLESS_URL=http://browserless:3000
      # --- Media public-hosting (publish pipeline) ---
      # Backend order tried by myUtils.media_remote_storage. "share" is the
      # self-hosted tgstate host (preferred); "do_spaces" is the S3/R2 backup.
      - SAU_STORAGE_BACKENDS=share,do_spaces
      # share/tgstate host: disabled until its Telegram bot token is refreshed
      # (getUpdates/sendDocument currently return Unauthorized). To enable:
      # refresh the bot token in the tgstate settings, add SAU_SHARE_SESSION_TOKEN
      # to .env, then set SAU_SHARE_ENABLED=1. While disabled, media is served
      # from DO Spaces / R2.
      - SAU_SHARE_ENABLED=0
      - SAU_SHARE_PUBLIC_BASE=https://share.iamwillywang.com
      - SAU_SHARE_UPLOAD_BASE=http://share-web
      # Verified URL prefixes for TikTok PULL_FROM_URL (DIRECT_POST only).
      # FILE_UPLOAD (draft mode) does not require these. Domains must also be
      # verified in the TikTok developer console before DIRECT_POST works.
      - SAU_TIKTOK_VERIFIED_URL_PREFIXES=https://pub-9915b1494003455c9ab872fd7094e64e.r2.dev/,https://share.iamwillywang.com/

  # Local development PostgreSQL for the multi-tenant migration (Phase 2+).
  # Opt-in: it only starts with `docker compose --profile dev up`, so the
  # production single-service stack is unchanged. Point the app/tests at it via
  #   DATABASE_URL=postgresql+psycopg://sau:sau@postgres:5432/sau
  #   TEST_DATABASE_URL=postgresql+psycopg://sau:sau@localhost:5433/sau
  postgres:
    image: postgres:16-alpine
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: sau
      POSTGRES_PASSWORD: sau
      POSTGRES_DB: sau
    ports:
      - "5433:5432"
    volumes:
      - sau_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sau"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sau_pgdata:

networks:
  1panel-network:
    external: true
