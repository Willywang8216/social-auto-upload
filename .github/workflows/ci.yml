name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - name: Locked backend gates (all maintained Python and all tests, including security)
        run: bash scripts/release-gates.sh backend --python '${{ matrix.python }}' --receipts "$RUNNER_TEMP/receipts"
      - uses: actions/upload-artifact@v4
        with:
          name: release-backend-${{ matrix.python }}
          path: ${{ runner.temp }}/receipts/backend-${{ matrix.python }}.json
          if-no-files-found: error

  postgres-tests:
    # Additional dialect coverage; production release gates exercise SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sau
          POSTGRES_PASSWORD: sau
          POSTGRES_DB: sautest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sau"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sau:sau@localhost:5432/sautest
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - name: Install frozen dependencies (with postgres extra)
        run: uv sync --frozen --extra web --extra postgres --group dev --no-install-project
      - name: Create non-production config
        run: cp conf.example.py conf.py
      - name: Repository, identity and migration tests against PostgreSQL
        run: uv run --no-sync python -X utf8 -m pytest tests/test_db_repositories.py tests/test_identity_provisioning.py tests/test_alembic.py -q --basetemp "$RUNNER_TEMP/pytest-postgres"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
      - name: Frontend npm ci, test, build gates
        run: bash scripts/release-gates.sh frontend --receipts "$RUNNER_TEMP/receipts"
      - uses: actions/upload-artifact@v4
        with:
          name: release-frontend
          path: ${{ runner.temp }}/receipts/frontend.json
          if-no-files-found: error

  dependency-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep the legacy dependency path on Patchright
        run: |
          ! grep -q '^playwright==' requirements.txt
          grep -q '^patchright==' requirements.txt
